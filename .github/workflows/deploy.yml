name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main        # main 브랜치에 push 될 때마다 자동 배포
  workflow_dispatch: # 수동 실행도 가능하게 설정

# GitHub Pages 배포에 필요한 권한 설정
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 방지 (진행 중인 배포가 있으면 취소 후 새로 배포)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ─── 1단계: 빌드 ───────────────────────────────────────
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 소스 체크아웃
        uses: actions/checkout@v4

      - name: 🟢 Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 의존성 설치
        run: npm ci

      - name: 🔨 프로덕션 빌드
        run: npm run build

      - name: ⚙️ GitHub Pages 설정
        uses: actions/configure-pages@v4

      - name: 📤 빌드 결과물 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'   # Vite 기본 빌드 출력 폴더

  # ─── 2단계: 배포 ───────────────────────────────────────
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build   # build 잡이 성공해야 실행

    steps:
      - name: 🚀 GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
